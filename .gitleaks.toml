# .gitleaks.toml — Plan 06-02 / CICD-05, rewritten in Plan 22-05 / CF-06.
# Consumed by the CI secret-scan job:
#   gitleaks dir . --config .gitleaks.toml --redact --exit-code 1 -v
#
# Strategy: inherit gitleaks' maintained provider ruleset (do NOT hand-roll entropy
# heuristics), then allowlist ONLY bare publishable Clerk `pk_` keys, which are
# non-secret by design (they ship in the client bundle). Secret `sk_` shapes are
# never allowlisted, so a real Clerk/Resend key still fails the scan in every path.
#
# No path allowlist, on purpose: `gitleaks dir` skips a file that matches a global
# allowlist `paths` entry before it looks at anything else (sources/common.go in
# v8.30.1), so a secret under an allowlisted path was never scanned at all, whatever
# `condition` said. The regex below is matched against the whole extracted secret
# (gitleaks' default regexTarget) and anchored, so only a bare publishable key is
# allowed; a pk_ substring next to a secret can never mask it.
#
# scripts/gitleaks-selftest.sh proves both directions (pk_ passes, sk_ fails in
# every path, mixed line fails); CI runs it. Re-run it before bumping gitleaks.
title = "dashboard-cf-hono-template"

[extend]
useDefault = true                       # inherit gitleaks' built-in provider rules

# v8.25.0+ uses the plural [[allowlists]] table (NOT singular [allowlist]).
[[allowlists]]
description = "Publishable Clerk keys are non-secret by design; anchored so a pk_ substring can never mask a secret"
regexes = ['''^pk_(test|live)_[A-Za-z0-9._=-]+$''']
