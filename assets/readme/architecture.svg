<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">How a request flows through the single Worker</title>
<desc id="d">The browser calls one Cloudflare Worker. Requests to /api/* run the Hono API first, which checks the Clerk session and reads D1 and KV. Every other path is served from Static Assets as the React SPA. A Cron, Queues and Resend layer ships dormant.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a4a"/><stop offset="1" stop-color="#060d29"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7cc8f7"/></marker></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="56" y="70" fill="#fff" font-size="34" font-weight="700">One Worker, one deploy</text>
<text x="56" y="106" fill="#9fb3dc" font-size="20">The platform serves the SPA for free. Hono only sees /api/*.</text>
<!-- browser -->
<rect x="56" y="230" width="190" height="120" rx="18" fill="#132457" stroke="#3b5bab"/>
<text x="151" y="280" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">Browser</text>
<text x="151" y="312" fill="#9fb3dc" font-size="18" text-anchor="middle">React SPA</text>
<line x1="246" y1="290" x2="320" y2="290" stroke="#7cc8f7" stroke-width="3" marker-end="url(#a)"/>
<!-- worker -->
<rect x="328" y="140" width="520" height="350" rx="22" fill="none" stroke="#38aaf0" stroke-width="2" stroke-dasharray="0"/>
<text x="352" y="176" fill="#7cc8f7" font-size="18" font-weight="700" letter-spacing="2">CLOUDFLARE WORKER</text>
<rect x="352" y="200" width="472" height="118" rx="16" fill="#132457" stroke="#3b5bab"/>
<text x="376" y="240" fill="#fff" font-size="22" font-weight="700">/api/*  →  Hono</text>
<text x="376" y="272" fill="#9fb3dc" font-size="18">run_worker_first · zod-validated · localized 400s</text>
<text x="376" y="300" fill="#9fb3dc" font-size="18">requireAuth: Clerk session, azp-pinned</text>
<rect x="352" y="338" width="472" height="128" rx="16" fill="#132457" stroke="#3b5bab"/>
<text x="376" y="378" fill="#fff" font-size="22" font-weight="700">everything else  →  Static Assets</text>
<text x="376" y="410" fill="#9fb3dc" font-size="18">Vite build served at the edge, no Worker CPU</text>
<text x="376" y="438" fill="#9fb3dc" font-size="18">SPA fallback for TanStack Router paths</text>
<!-- bindings -->
<line x1="824" y1="240" x2="912" y2="200" stroke="#7cc8f7" stroke-width="3" marker-end="url(#a)"/>
<line x1="824" y1="270" x2="912" y2="296" stroke="#7cc8f7" stroke-width="3" marker-end="url(#a)"/>
<rect x="920" y="160" width="224" height="78" rx="16" fill="#132457" stroke="#3b5bab"/>
<text x="944" y="196" fill="#fff" font-size="22" font-weight="700">D1</text>
<text x="944" y="222" fill="#9fb3dc" font-size="18">SQLite · Drizzle</text>
<rect x="920" y="258" width="224" height="78" rx="16" fill="#132457" stroke="#3b5bab"/>
<text x="944" y="294" fill="#fff" font-size="22" font-weight="700">KV</text>
<text x="944" y="320" fill="#9fb3dc" font-size="18">settings blob</text>
<rect x="920" y="370" width="224" height="120" rx="16" fill="none" stroke="#5c6f9c" stroke-dasharray="7 6"/>
<text x="944" y="406" fill="#c6d2ee" font-size="20" font-weight="700">Dormant</text>
<text x="944" y="434" fill="#9fb3dc" font-size="18">Cron → Queues</text>
<text x="944" y="460" fill="#9fb3dc" font-size="18">→ Resend email</text>
<text x="56" y="530" fill="#7d8db5" font-size="18">wrangler.jsonc: assets.not_found_handling = "single-page-application", run_worker_first = ["/api/*"]</text>
</g></svg>
